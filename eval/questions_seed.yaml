# Bộ câu hỏi đánh giá — DỮ LIỆU TỔNG HỢP.
# Câu hỏi do LLM (Claude) soạn dựa trên các văn bản tổng hợp trong data/raw/. Cần kiểm tra lại thủ công
# một phần trước khi dùng kết quả để ra quyết định (xem README, mục "Bộ đánh giá").
#
# Mỗi mục:
#   id        mã câu hỏi
#   question  câu hỏi tiếng Việt, viết như người dùng hỏi
#   doc_id    văn bản chứa câu trả lời (tên file không có đuôi)
#   evidence  đoạn trích NGUYÊN VĂN chứa câu trả lời; eval/make_eval_set.py dùng nó để tìm id chunk đúng
#   type      keyword    = câu hỏi dùng lại từ khoá chính của đoạn văn
#             paraphrase = diễn đạt khác / từ đồng nghĩa / cần suy luận nhẹ (ví dụ "tiền cơm" ~ "phụ cấp ăn trưa")

